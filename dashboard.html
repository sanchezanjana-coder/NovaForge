<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaForge Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logoArea">

                <h2>NovaForge</h2>

                <span>Your Intelligent Development Partner</span>

            </div>

            <nav class="menu">

                <a href="#" class="active">🏠 Home</a>
                <a href="#">💬 AI Chat</a>
                <a href="#">📦 Scripts</a>
                <a href="#">📚 Library</a>
                <a href="#">🐞 Errors</a>
                <a href="#">⭐ Favorites</a>
                <a href="#">🕓 History</a>
                <a href="#">⚙ Settings</a>

            </nav>

        </aside>

        <!-- Contenido -->
        <main class="content">

            <header class="topbar">

                <h1>Welcome back!</h1>

                <button class="navButton">

                    New Chat

                </button>

            </header>

            <section class="chatArea">

                <div class="messages" id="messages">

                    <div class="aiMessage">

                        👋 <strong>Welcome to NovaForge AI!</strong><br><br>

                        I'm ready to help you create Roblox systems, websites,
                        LuaU scripts, fix errors and much more.

                    </div>

                </div>

                <div class="chatInput">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Message NovaForge..."
                    >

                    <button id="sendButton">

                        ➜

                    </button>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
