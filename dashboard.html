<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaForge Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">

                <h2>NovaForge</h2>

                <p>Your Intelligent Development Partner</p>

            </div>

            <nav class="sidebarMenu">

                <a href="#">🏠 Home</a>

                <a href="#">💬 AI Chat</a>

                <a href="#">📦 Scripts</a>

                <a href="#">📚 Tutorials</a>

                <a href="#">🐞 Errors</a>

                <a href="#">⭐ Favorites</a>

                <a href="#">🕓 History</a>

                <a href="#">⚙ Settings</a>

            </nav>

        </aside>

        <!-- Main -->

        <main class="mainContent">

            <header class="topBar">

                <h1>Welcome back 👋</h1>

                <button class="navButton">

                    New Chat

                </button>

            </header>

            <section class="chatArea">

                <h2>What do you want to build today?</h2>

                <p>

                    Generate scripts, fix errors or learn LuaU with NovaForge AI.

                </p>

                <div class="quickActions">

                    <button>Inventory</button>

                    <button>NPC</button>

                    <button>Shop</button>

                    <button>Weapon</button>

                    <button>DataStore</button>

                    <button>GUI</button>

                </div>

            </section>

            <footer class="chatInput">

                <input
                    type="text"
                    placeholder="Ask NovaForge anything..."
                >

                <button>

                    Send

                </button>

            </footer>

        </main>

    </div>

</body>
</html>
